name: mindspace
description: "Mindspace — Mental Health & Wellness App"
publish_to: 'none'
version: 1.1.6+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.10

  # Navigation
  go_router: ^14.8.1

  # UI & Animations
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  animate_do: ^3.3.4
  confetti: ^0.8.0

  # Local Storage
  shared_preferences: ^2.5.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  http: ^1.2.1
  url_launcher: ^6.2.6

  # Icons
  cupertino_icons: ^1.0.8
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  google_sign_in: ^6.2.1
  cloud_firestore: ^6.2.0
  socket_io_client: ^2.0.0
  flutter_local_notifications: ^21.0.0
  timezone: ^0.11.0
  flutter_native_splash: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/images/logo/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/logo-rounded.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/logo-rounded.png
  android_12:
    image: assets/images/logo-rounded.png
    color: "#FFFFFF"
  fullscreen: true
